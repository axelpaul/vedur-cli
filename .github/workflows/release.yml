name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check tag matches package.json version
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }
      - name: Compile binaries
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "${target%%-*}" = windows ] && ext=".exe"
            bun build ./src/index.ts --compile --minify --target="bun-${target}" --outfile "release/vedur-${target}${ext}"
          done
          ./release/vedur-linux-x64 --version
          bun scripts/smoke-mcp.ts ./release/vedur-linux-x64
          cd release && sha256sum vedur-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
